@if(book$ | async; as book){
<h3>{{ book.title }}</h3>
<h4>{{ book.subtitle }}</h4>
<p appOrderBtn="Kaufen">{{ book.abstract }}</p>
<h5>{{ book.numPages | pages }}</h5>
<!-- <h5>{{ transform(book.numPages) }}</h5> -->
<img [src]="book.cover" [alt]="book.title" />
} @else { Waiting.... }
